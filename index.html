<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧭 Your Local Friend Trip Planner (AI Powered)</title>
    <!-- Google Fonts & Font Awesome (Opsional, biarkan saja) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        /* ---------- KODE CSS PERTAHANKAN SEPERTI ASLI ---------- */
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #475569;
            --border: #e2e8f0;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --radius: 24px;
            --radius-sm: 12px;
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2.5rem 3rem;
            transition: var(--transition);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .subhead {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 2rem;
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        label i {
            color: var(--accent);
            width: 1.1rem;
            font-size: 0.95rem;
        }

        select,
        input {
            padding: 0.7rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: white;
            transition: var(--transition);
            color: var(--text);
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
        }

        .btn-generate {
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        .btn-generate:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-generate i {
            font-size: 1.1rem;
        }

        /* ---------- HASIL (RESULT) ---------- */
        #result-container {
            margin-top: 2.5rem;
            border-top: 2px dashed var(--border);
            padding-top: 2rem;
        }

        #result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        #result-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #result-header h2 i {
            color: var(--accent);
        }

        .badge-ai {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.25rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.3px;
        }

        #result-content {
            background: #f8fafc;
            border-radius: var(--radius-sm);
            padding: 1.75rem 2rem;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
        }

        #result-content .placeholder {
            color: #94a3b8;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        #result-content .placeholder i {
            font-size: 1.2rem;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .container { padding: 1.5rem; }
            h1 { font-size: 1.6rem; flex-wrap: wrap; }
            .form-grid { grid-template-columns: 1fr; gap: 1rem; }
            .form-group.full { grid-column: 1; }
            #result-content { padding: 1.25rem; }
        }

        /* ---------- SISA TEMPLATE PERTAHANKAN ---------- */
        /* (Tidak ada tambahan style baru) */
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>🧭 Your Local Friend Trip Planner</span>
            <span style="font-size: 0.7em; background: #eef2ff; color: #4338ca; padding: 0.2rem 0.8rem; border-radius: 40px; font-weight: 600;">AI Powered</span>
        </h1>
        <div class="subhead">
            <i class="fas fa-map-pin" style="color: var(--accent); margin-right: 0.4rem;"></i>
            Buat rencana perjalanan yang personal &mdash; seperti saran dari teman lokal!
        </div>

        <!-- FORM (tetap seperti asli, hanya ditambahkan id agar mudah diambil) -->
        <div class="form-grid">
            <div class="form-group">
                <label for="destination"><i class="fas fa-location-dot"></i> Destinasi</label>
                <select id="destination">
                    <option value="Singapore" selected>🇸🇬 Singapore</option>
                    <option value="Bangkok">🇹🇭 Bangkok</option>
                    <option value="Tokyo">🇯🇵 Tokyo</option>
                    <option value="Bali">🇮🇩 Bali</option>
                    <option value="Seoul">🇰🇷 Seoul</option>
                </select>
            </div>
            <div class="form-group">
                <label for="duration"><i class="fas fa-calendar-days"></i> Durasi (hari)</label>
                <input type="number" id="duration" min="1" max="14" value="4" />
            </div>
            <div class="form-group">
                <label for="budget"><i class="fas fa-wallet"></i> Anggaran</label>
                <select id="budget">
                    <option value="budget">💰 Budget (hemat)</option>
                    <option value="mid-range" selected>💵 Mid-range (seimbang)</option>
                    <option value="luxury">✨ Luxury (mewah)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="vibe"><i class="fas fa-flag"></i> Ritme</label>
                <select id="vibe">
                    <option value="relaxed">🌴 Santai (Relaxed)</option>
                    <option value="moderate" selected>🚶 Moderate (seimbang)</option>
                    <option value="intense">🏃 Intense (padat)</option>
                </select>
            </div>
            <div class="form-group full">
                <label for="interest"><i class="fas fa-heart"></i> Minat utama</label>
                <select id="interest">
                    <option value="culinary">🍜 Kuliner & Street Food</option>
                    <option value="culture" selected>🏛️ Budaya & Sejarah</option>
                    <option value="nature">🌿 Alam & Outdoor</option>
                    <option value="anime">🎌 Anime & Pop Culture</option>
                    <option value="hidden">🔍 Hidden Gems (off the beaten path)</option>
                    <option value="shopping">🛍️ Belanja & Fashion</option>
                </select>
            </div>
        </div>

        <!-- TOMBOL GENERATE (tetap seperti asli, ditambah id) -->
        <button class="btn-generate" id="generateBtn">
            <i class="fas fa-wand-magic-sparkles"></i> Generate Trip Plan
        </button>

        <!-- AREA HASIL (tetap seperti asli) -->
        <div id="result-container">
            <div id="result-header">
                <h2><i class="fas fa-route"></i> Rencana Perjalanan</h2>
                <span class="badge-ai"><i class="fas fa-brain"></i> AI-generated</span>
            </div>
            <div id="result-content">
                <span class="placeholder">
                    <i class="fas fa-spinner fa-pulse"></i>
                    Klik tombol <strong>“Generate Trip Plan”</strong> untuk mulai merencanakan petualanganmu!
                </span>
            </div>
        </div>
    </div>

    <!-- ========== TAMBAHAN SCRIPT (SATU-SATUNYA YANG DIUBAH) ========== -->
    <script>
        (function() {
            "use strict";

            // Ambil elemen-elemen yang dibutuhkan
            const generateBtn = document.getElementById('generateBtn');
            const resultContent = document.getElementById('result-content');

            // Data aktivitas berdasarkan minat (untuk Singapore)
            const activityMap = {
                culinary: [
                    'Sarapan di pasar pagi dengan kaya toast & kopi lokal.',
                    'Tur kuliner jalanan di Chinatown atau Little India.',
                    'Mencicipi chili crab di hawker center bintang Michelin.',
                    'Eksplorasi dessert dan kue tradisional di toko lawas.'
                ],
                culture: [
                    'Menjelajahi kuil-kuil bersejarah dan museum nasional.',
                    'Tur jalan kaki warisan kolonial di Civic District.',
                    'Mengunjungi kampung tradisional dan galeri seni lokal.',
                    'Menikmati pertunjukan budaya atau festival jalanan.'
                ],
                nature: [
                    'Jalan pagi di Gardens by the Bay atau Botanical Gardens.',
                    'Trekking ringan di Southern Ridges atau MacRitchie Reservoir.',
                    'Bersepeda di Pulau Ubin atau East Coast Park.',
                    'Sunset cruise atau piknik di taman tepi laut.'
                ],
                anime: [
                    'Mengunjungi toko merchandise anime & manga di Orchard Road.',
                    'Tur ke kafe bertema anime atau cosplay center.',
                    'Menjelajahi distrik elektronik & arcade game klasik.',
                    'Mengikuti workshop drawing atau meetup komunitas.'
                ],
                hidden: [
                    'Menemukan kedai kopi tua di jantung kota yang jarang diketahui.',
                    'Jelajahi lorong-lorong seni dan mural di kampung.',
                    'Mengunjungi pasar lokal yang tidak ada di panduan turis.',
                    'Mencicipi makanan rumahan di warung makan tersembunyi.'
                ],
                shopping: [
                    'Belanja di mal-mal mewah Orchard Road.',
                    'Mencari barang vintage di toko-toko independen.',
                    'Mengunjungi pasar loak dan factory outlet.',
                    'Berburu oleh-oleh khas di pusat kerajinan.'
                ]
            };

            // Label untuk tampilan
            const budgetLabel = {
                budget: '💰 Hemat (Budget)',
                'mid-range': '💵 Menengah (Mid-range)',
                luxury: '💎 Mewah (Luxury)'
            };

            const vibeLabel = {
                relaxed: '🌴 Santai (Relaxed)',
                moderate: '🚶 Moderate (seimbang)',
                intense: '🏃 Intense (padat)'
            };

            const interestLabel = {
                culinary: '🍜 Kuliner & Street Food',
                culture: '🏛️ Budaya & Sejarah',
                nature: '🌿 Alam & Outdoor',
                anime: '🎌 Anime & Pop Culture',
                hidden: '🔍 Hidden Gems',
                shopping: '🛍️ Belanja & Fashion'
            };

            // Fungsi utama generate
            function generatePlan() {
                // Ambil nilai dari form
                const destination = document.getElementById('destination').value || 'Singapore';
                const duration = parseInt(document.getElementById('duration').value, 10) || 4;
                const budget = document.getElementById('budget').value || 'mid-range';
                const vibe = document.getElementById('vibe').value || 'moderate';
                const interest = document.getElementById('interest').value || 'culture';

                // Ambil daftar aktivitas sesuai minat, fallback ke culture
                const activities = activityMap[interest] || activityMap.culture;

                // Bangun output
                let output = '';
                output += `📅 **Rencana ${duration} Hari di ${destination}**\n`;
                output += `💰 Anggaran: ${budgetLabel[budget] || budget}\n`;
                output += `🌟 Minat: ${interestLabel[interest] || interest}\n`;
                output += `⚡ Ritme: ${vibeLabel[vibe] || vibe}\n\n`;

                // Loop per hari
                for (let i = 0; i < duration; i++) {
                    const dayNum = i + 1;
                    const activity = activities[i % activities.length];
                    
                    let extra = '';
                    if (i === 0) extra = ' (Hari tiba, check-in, mulai eksplorasi ringan)';
                    else if (i === duration - 1) extra = ' (Hari terakhir, persiapan pulang & oleh-oleh)';
                    else if (i === 1) extra = ' (Hari penuh eksplorasi)';
                    else if (i === 2) extra = ' (Jelajahi lebih dalam)';
                    
                    output += `**Hari ${dayNum}:**\n`;
                    output += `• ${activity}${extra}\n`;
                    
                    // Sisipkan hidden gem di hari ke-2 jika durasi >= 3
                    if (i === 1 && duration >= 3) {
                        const hiddenSpots = ['Kampong Glam', 'Joo Chiat', 'Tiong Bahru', 'Geylang Serai'];
                        const spot = hiddenSpots[dayNum % hiddenSpots.length];
                        output += `  💎 *Hidden Gem:* Cari warung kopi tua atau pasar lokal di ${spot}.\n`;
                    }
                    output += '\n';
                }

                // Tips penutup
                output += `---\n💡 **Tips Lokal untuk ${destination}:**\n`;
                if (destination === 'Singapore') {
                    output += `• Gunakan MRT untuk transportasi utama.\n`;
                    output += `• Bawa payung kecil (cuaca tropis sering hujan tiba-tiba).\n`;
                    output += `• Beli kartu EZ-Link untuk kemudahan transportasi.\n`;
                    output += `• Jangan lewatkan durian di musimnya! 🍈\n`;
                } else if (destination === 'Bangkok') {
                    output += `• Naik BTS atau taksi air untuk hindari macet.\n`;
                    output += `• Bawa pakaian tipis dan nyaman (cuaca panas).\n`;
                    output += `• Coba makanan pinggir jalan, tapi pastikan bersih.\n`;
                } else if (destination === 'Tokyo') {
                    output += `• Gunakan JR Pass untuk perjalanan antar kota.\n`;
                    output += `• Bawa uang tunai karena banyak tempat tidak terima kartu.\n`;
                    output += `• Patuhi aturan antre dan tidak makan sambil jalan.\n`;
                } else {
                    output += `• Pelajari sedikit bahasa lokal untuk interaksi lebih hangat.\n`;
                    output += `• Gunakan transportasi umum atau ojek online.\n`;
                    output += `• Tanyakan rekomendasi ke warga sekitar.\n`;
                }

                // Tampilkan ke result-content (ganti newline dengan <br>)
                resultContent.innerHTML = output.replace(/\n/g, '<br>');
            }

            // Event listener tombol generate
            generateBtn.addEventListener('click', generatePlan);

            // Opsional: generate otomatis saat halaman pertama kali dimuat?
            // (Saya tidak mengaktifkan agar pengguna sengaja mengklik tombol)
            // Jika ingin langsung muncul, hapus komentar di bawah:
            // generatePlan();

        })();
    </script>
</body>
</html>
