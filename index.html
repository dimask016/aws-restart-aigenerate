<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧭 AI Trip Planner - Singapore</title>
    <style>
        /* Style dasar agar lebih rapi */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f0f4f8;
            color: #1e293b;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0f3b5e;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
        }
        .input-group {
            margin: 25px 0;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
        }
        select:focus, input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #2563eb;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(59,130,246,0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            border-left: 6px solid #3b82f6;
            white-space: pre-wrap;
            font-family: 'Segoe UI', sans-serif;
        }
        .placeholder {
            color: #94a3b8;
            font-style: italic;
        }
        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧭 Your Local Friend Trip Planner (AI Powered)</h1>
        <p>Rencanakan perjalanan <span class="badge">Singapore</span> dengan gaya lokal!</p>

        <!-- FORM INPUT -->
        <div class="input-group">
            <label for="duration">📅 Durasi (hari)</label>
            <input type="number" id="duration" min="1" max="10" value="4">
        </div>

        <div class="input-group">
            <label for="budget">💰 Anggaran</label>
            <select id="budget">
                <option value="mid-range" selected>Mid-range (Rp 5-10 juta)</option>
                <option value="budget">Budget (Rp 2-5 juta)</option>
                <option value="luxury">Luxury (Rp 15+ juta)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="interest">🌟 Minat Utama</label>
            <select id="interest">
                <option value="culinary">Kuliner & Street Food</option>
                <option value="culture" selected>Budaya & Sejarah</option>
                <option value="nature">Alam & Outdoor</option>
                <option value="anime">Anime & Pop Culture</option>
                <option value="hidden">Hidden Gems (Off the beaten path)</option>
            </select>
        </div>

        <button id="generateBtn">✨ Generate Trip Plan</button>

        <!-- TEMPAT HASIL -->
        <div id="result">
            <span class="placeholder">Klik tombol di atas untuk menghasilkan rekomendasi perjalanan...</span>
        </div>
    </div>

    <script>
        // --- LOGIKA GENERATE ---
        document.getElementById('generateBtn').addEventListener('click', function() {
            // Ambil nilai dari input
            const duration = document.getElementById('duration').value || 4;
            const budget = document.getElementById('budget').value;
            const interest = document.getElementById('interest').value;

            // Peta label untuk tampilan yang lebih rapi
            const budgetLabel = {
                'budget': '💰 Hemat (Budget)',
                'mid-range': '💵 Menengah (Mid-range)',
                'luxury': '💎 Mewah (Luxury)'
            };

            const interestLabel = {
                'culinary': '🍜 Kuliner & Street Food',
                'culture': '🏛️ Budaya & Sejarah',
                'nature': '🌿 Alam & Outdoor',
                'anime': '🎌 Anime & Pop Culture',
                'hidden': '🔍 Hidden Gems'
            };

            // --- DATA DINAMIS BERDASARKAN MINAT ---
            let dailyActivities = [];
            
            // Base activity untuk setiap hari (akan dikustomisasi)
            const baseActivities = {
                'culinary': [
                    'Sarapan di pasar pagi terkenal, cicipi kaya toast & kopi lokal.',
                    'Tur kuliner jalanan di kawasan Chinatown atau Little India.',
                    'Mengunjungi hawker center bintang Michelin dengan harga terjangkau.',
                    'Mencicipi seafood chili crab di restoran tepi pantai.'
                ],
                'culture': [
                    'Menjelajahi kuil-kuil bersejarah dan museum nasional.',
                    'Tur jalan kaki warisan kolonial di Civic District.',
                    'Mengunjungi kampung tradisional dan galeri seni lokal.',
                    'Menikmati pertunjukan budaya atau festival jalanan.'
                ],
                'nature': [
                    'Jalan pagi di Gardens by the Bay atau Botanical Gardens.',
                    'Trekking ringan di Southern Ridges atau MacRitchie Reservoir.',
                    'Bersepeda di Pulau Ubin atau East Coast Park.',
                    'Sunset cruise atau piknik di taman tepi laut.'
                ],
                'anime': [
                    'Mengunjungi toko merchandise anime & manga di Orchard Road.',
                    'Tur ke kafe bertema anime atau cosplay center.',
                    'Menjelajahi distrik elektronik & arcade game klasik.',
                    'Mengikuti workshop drawing atau meetup komunitas.'
                ],
                'hidden': [
                    'Menemukan kedai kopi tua di jantung kota yang jarang diketahui.',
                    'Jelajahi lorong-lorong seni dan mural di kampung.',
                    'Mengunjungi pasar lokal yang tidak ada di panduan turis.',
                    'Mencicipi makanan rumahan di warung makan tersembunyi.'
                ]
            };

            // Ambil aktivitas sesuai minat, atau fallback ke budaya jika tidak ada
            const activities = baseActivities[interest] || baseActivities['culture'];

            // Bangun itinerary per hari
            let itinerary = `📅 **Rencana ${duration} Hari di Singapore**\n`;
            itinerary += `💰 Anggaran: ${budgetLabel[budget] || budget}\n`;
            itinerary += `🌟 Minat: ${interestLabel[interest] || interest}\n`;
            itinerary += `⚡ Ritme: Moderate (seimbang antara eksplorasi & santai)\n\n`;

            for (let i = 0; i < duration; i++) {
                const dayNum = i + 1;
                // Ambil aktivitas berdasarkan urutan, jika kurang ulangi dari awal
                const activity = activities[i % activities.length];
                // Tambahkan variasi untuk hari ke-i
                let extra = '';
                if (i === 0) extra = ' (Hari tiba, check-in, dan mulai eksplorasi)';
                else if (i === duration - 1) extra = ' (Hari terakhir, persiapan pulang & oleh-oleh)';
                else if (i === 1) extra = ' (Hari penuh eksplorasi)';
                else if (i === 2) extra = ' (Jelajahi lebih dalam)';
                
                itinerary += `**Hari ${dayNum}:**\n`;
                itinerary += `• ${activity}${extra}\n`;
                
                // Tambahkan rekomendasi hidden gem di hari ke-2 jika durasi > 2
                if (i === 1 && duration >= 3) {
                    itinerary += `  💎 *Hidden Gem:* Coba cari warung kopi tua di ${['Kampong Glam', 'Joo Chiat', 'Tiong Bahru'][dayNum % 3]}.\n`;
                }
                itinerary += '\n';
            }

            // Tambahkan tips penutup
            itinerary += `---\n💡 **Tips Lokal:**\n`;
            itinerary += `• Gunakan MRT untuk transportasi utama.\n`;
            itinerary += `• Bawa payung kecil (cuaca tropis sering hujan tiba-tiba).\n`;
            itinerary += `• Beli kartu EZ-Link untuk kemudahan transportasi.\n`;
            itinerary += `• Jangan lewatkan durian di musimnya! 🍈\n`;

            // Tampilkan hasil ke elemen #result
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = itinerary.replace(/\n/g, '<br>'); // ganti newline ke <br> agar tampil di HTML
        });
    </script>
</body>
</html>
